<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11142b">
  <title>Orbit Quiz — Space Explorer</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #101326;
      --surface: #191d37;
      --surface-raised: #202544;
      --text: #f5f4ff;
      --muted: #a7acc8;
      --line: #303654;
      --accent: #a897ff;
      --accent-strong: #8570fa;
      --success: #48d6a0;
      --success-bg: #163d39;
      --error: #ff7184;
      --error-bg: #492837;
      --shadow: 0 24px 70px rgb(3 5 20 / 35%);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f3fc;
        --surface: #fff;
        --surface-raised: #f5f4ff;
        --text: #20213d;
        --muted: #6d718e;
        --line: #e4e3f0;
        --accent: #6f5be8;
        --accent-strong: #5f4bd6;
        --success: #14845e;
        --success-bg: #e2f7ee;
        --error: #c8425b;
        --error-bg: #ffebef;
        --shadow: 0 24px 70px rgb(41 37 88 / 12%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 18%, rgb(136 110 255 / 13%), transparent 32%),
        radial-gradient(ellipse at 90% 82%, rgb(64 204 194 / 10%), transparent 28%),
        var(--bg);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 560px);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .brand-title {
      color: #ff596d;
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #a897ff, #6c79f7);
      box-shadow: 0 6px 18px rgb(125 104 244 / 30%);
      font-size: 18px;
    }

    .score-pill, .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score-pill {
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      white-space: nowrap;
    }

    .score-pill strong { color: var(--text); }

    .progress-block { margin-bottom: 28px; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .progress-track {
      height: 8px;
      border-radius: 20px;
      background: var(--surface-raised);
      overflow: hidden;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8b78ff, #63d9c3);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-number {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.2;
      letter-spacing: -.035em;
    }

    .intro-copy, .result-copy {
      max-width: 430px;
      margin: 13px 0 25px;
      color: var(--muted);
    }

    .question {
      min-height: 74px;
      margin: 0 0 20px;
      font-size: clamp(20px, 4vw, 24px);
      line-height: 1.35;
      letter-spacing: -.02em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 58px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--surface-raised);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer.correct {
      border-color: var(--success);
      color: var(--success);
      background: var(--success-bg);
      animation: pop-in 380ms ease both;
    }

    .answer.wrong {
      border-color: var(--error);
      color: var(--error);
      background: var(--error-bg);
      animation: shake 420ms ease both;
    }

    .answer-mark {
      display: grid;
      flex: 0 0 30px;
      width: 30px;
      height: 30px;
      margin-right: 12px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct .answer-mark, .answer.wrong .answer-mark {
      border-color: currentColor;
      color: currentColor;
    }

    .feedback {
      min-height: 26px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .feedback.is-correct { color: var(--success); }
    .feedback.is-wrong { color: var(--error); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .primary-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #8f7aff, #6e6ff3);
      box-shadow: 0 8px 20px rgb(125 104 244 / 25%);
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .primary-button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .primary-button:active { transform: translateY(0); }

    .intro, .results { text-align: center; }

    .hero-emoji, .result-emoji {
      display: grid;
      width: 94px;
      height: 94px;
      margin: 8px auto 23px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface-raised);
      box-shadow: inset 0 0 32px rgb(135 116 255 / 10%);
      font-size: 48px;
      animation: float 3.2s ease-in-out infinite;
    }

    .intro .eyebrow, .results .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .intro h1, .results h2 { font-size: clamp(29px, 6vw, 38px); }
    .intro-copy, .result-copy { margin-right: auto; margin-left: auto; }
    .intro .primary-button, .results .primary-button { width: 100%; margin-top: 3px; }
    .result-score { margin: 15px 0 0; font-size: 17px; font-weight: 700; }
    .result-score strong { color: var(--accent); font-size: 26px; }
    .personal-best { margin: 12px 0 0; color: var(--accent); font-weight: 750; }

    [hidden] { display: none !important; }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-6px); }
      30%, 60%, 90% { transform: translateX(6px); }
    }

    @keyframes pop-in {
      45% { transform: scale(1.025); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      .quiz { padding: 25px 20px; border-radius: 20px; }
      .topline { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-live="polite">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> <span class="brand-title">Orbit Quiz</span></div>
      <div class="score-pill" id="score-pill" hidden>Score <strong id="score">0</strong></div>
    </header>

    <section class="intro" id="intro">
      <div class="hero-emoji" aria-hidden="true">🚀</div>
      <p class="eyebrow">Mission briefing</p>
      <h1>Ready to explore?</h1>
      <p class="intro-copy">Take a quick trip across our solar system and beyond. Ten questions, one giant leap for your space knowledge.</p>
      <p class="personal-best" id="intro-best-score"></p>
      <button class="primary-button" id="start-button" type="button">Start your mission <span aria-hidden="true">→</span></button>
    </section>

    <section id="quiz-panel" hidden>
      <div class="progress-block">
        <div class="progress-label"><span id="progress-label">Question 1 of 10</span><span id="progress-percent">0%</span></div>
        <div class="progress-track" id="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
      <p class="question-number" id="question-number">Question 1</p>
      <h2 class="question" id="question"></h2>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback" aria-live="assertive"></p>
      <div class="actions"><button class="primary-button" id="next-button" type="button" hidden>Next question <span aria-hidden="true">→</span></button></div>
    </section>

    <section class="results" id="results" hidden>
      <div class="result-emoji" id="result-emoji" aria-hidden="true">🌟</div>
      <p class="eyebrow">Mission complete</p>
      <h2 id="result-title">Stellar work!</h2>
      <p class="result-score">You scored <strong id="final-score">0/10</strong></p>
      <p class="result-copy" id="result-copy"></p>
      <p class="personal-best" id="personal-best-message"></p>
      <button class="primary-button" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
    </section>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Jupiter", "Mercury"], correct: 1, fact: "Mars gets its rusty-red color from iron-rich dust." },
      { question: "What is the name of the galaxy we call home?", answers: ["Andromeda", "Whirlpool", "Milky Way", "Sombrero"], correct: 2, fact: "Our solar system sits in the Milky Way's Orion Arm." },
      { question: "Which planet has the most prominent ring system?", answers: ["Saturn", "Neptune", "Earth", "Uranus"], correct: 0, fact: "Saturn's rings are made mostly of ice and rocky debris." },
      { question: "What is the closest star to Earth?", answers: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"], correct: 2, fact: "The Sun is about 150 million kilometers from Earth." },
      { question: "Which planet is the largest in our solar system?", answers: ["Saturn", "Earth", "Neptune", "Jupiter"], correct: 3, fact: "Jupiter is so large that more than 1,300 Earths could fit inside it." },
      { question: "What do astronauts wear to survive outside a spacecraft?", answers: ["A flight suit", "A spacesuit", "A pressure coat", "A thermal cape"], correct: 1, fact: "Spacesuits provide oxygen, pressure, and protection from extreme temperatures." },
      { question: "Which celestial body was reclassified as a dwarf planet in 2006?", answers: ["Europa", "Ceres", "Pluto", "Titan"], correct: 2, fact: "Pluto is in the Kuiper Belt, a region beyond Neptune." },
      { question: "What force keeps planets in orbit around the Sun?", answers: ["Magnetism", "Gravity", "Friction", "Solar wind"], correct: 1, fact: "The Sun's gravity keeps the planets moving in their orbits." },
      { question: "Which planet is famous for its Great Red Spot?", answers: ["Mars", "Jupiter", "Venus", "Saturn"], correct: 1, fact: "Jupiter's Great Red Spot is a giant storm that has raged for centuries." },
      { question: "What is the name of the first human to walk on the Moon?", answers: ["Yuri Gagarin", "Buzz Aldrin", "John Glenn", "Neil Armstrong"], correct: 3, fact: "Neil Armstrong took his first steps on the Moon in July 1969." }
    ];

    const intro = document.querySelector("#intro");
    const quizPanel = document.querySelector("#quiz-panel");
    const results = document.querySelector("#results");
    const scorePill = document.querySelector("#score-pill");
    const scoreDisplay = document.querySelector("#score");
    const introBestScore = document.querySelector("#intro-best-score");
    const personalBestMessage = document.querySelector("#personal-best-message");
    const progressLabel = document.querySelector("#progress-label");
    const progressPercent = document.querySelector("#progress-percent");
    const progressTrack = document.querySelector("#progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const questionNumber = document.querySelector("#question-number");
    const questionTitle = document.querySelector("#question");
    const answersElement = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    let current = 0;
    let score = 0;
    const bestScoreKey = "orbitQuizBestScore";

    function getBestScore() {
      try {
        const storedScore = localStorage.getItem(bestScoreKey);
        if (storedScore === null || !/^(0|[1-9]\d*)$/.test(storedScore)) return null;
        const parsedScore = Number(storedScore);
        return Number.isSafeInteger(parsedScore) && parsedScore <= questions.length ? parsedScore : null;
      } catch (error) {
        console.warn("Unable to read the personal best from browser storage.", error);
        return null;
      }
    }

    function saveBestScore(bestScore) {
      try {
        localStorage.setItem(bestScoreKey, String(bestScore));
        return true;
      } catch (error) {
        console.warn("Unable to save the personal best to browser storage.", error);
        return false;
      }
    }

    function updateIntroBestScore() {
      const bestScore = getBestScore();
      introBestScore.textContent = bestScore === null
        ? "No personal best yet — finish a mission to set one."
        : `Personal best: ${bestScore}/${questions.length}`;
    }

    function updateProgress() {
      const completed = current;
      const percent = Math.round((completed / questions.length) * 100);
      progressLabel.textContent = `Question ${Math.min(current + 1, questions.length)} of ${questions.length}`;
      progressPercent.textContent = `${percent}%`;
      progressFill.style.width = `${percent}%`;
      progressTrack.setAttribute("aria-valuenow", String(completed));
    }

    function renderQuestion() {
      const item = questions[current];
      updateProgress();
      questionNumber.textContent = `Question ${current + 1}`;
      questionTitle.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      answersElement.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.dataset.index = String(index);
        button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}: ${answer}`);

        const mark = document.createElement("span");
        mark.className = "answer-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = String.fromCharCode(65 + index);
        const text = document.createElement("span");
        text.textContent = answer;
        button.append(mark, text);
        button.addEventListener("click", () => selectAnswer(index));
        answersElement.append(button);
      });
    }

    function selectAnswer(selected) {
      const item = questions[current];
      const buttons = [...answersElement.querySelectorAll(".answer")];
      buttons.forEach(button => { button.disabled = true; });
      progressFill.style.width = `${Math.round(((current + 1) / questions.length) * 100)}%`;
      progressPercent.textContent = `${Math.round(((current + 1) / questions.length) * 100)}%`;
      progressTrack.setAttribute("aria-valuenow", String(current + 1));
      const isCorrect = selected === item.correct;

      if (isCorrect) {
        score += 1;
        scoreDisplay.textContent = String(score);
        buttons[selected].classList.add("correct");
        buttons[selected].querySelector(".answer-mark").textContent = "✓";
        feedback.textContent = `Correct! ${item.fact}`;
        feedback.classList.add("is-correct");
      } else {
        buttons[selected].classList.add("wrong");
        buttons[selected].querySelector(".answer-mark").textContent = "×";
        buttons[item.correct].classList.add("correct");
        buttons[item.correct].querySelector(".answer-mark").textContent = "✓";
        feedback.textContent = `Not quite — ${item.fact}`;
        feedback.classList.add("is-wrong");
      }

      nextButton.textContent = current === questions.length - 1 ? "See your results" : "Next question";
      nextButton.append(document.createElement("span"));
      nextButton.lastElementChild.setAttribute("aria-hidden", "true");
      nextButton.lastElementChild.textContent = current === questions.length - 1 ? "✦" : "→";
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      const percent = score / questions.length;
      const previousBest = getBestScore();
      if (previousBest === null || score > previousBest) {
        personalBestMessage.textContent = saveBestScore(score)
          ? "New personal best!"
          : "Your new personal best could not be saved in this browser.";
      } else {
        personalBestMessage.textContent = `Your personal best remains ${previousBest}/${questions.length}.`;
      }
      const result = percent === 1
        ? ["🏆", "Out of this world!", "Perfect score! You’re a true space expert."]
        : percent >= .7
          ? ["🚀", "Stellar work!", "Your space knowledge is soaring. Keep exploring!"]
          : percent >= .4
            ? ["🪐", "Nice orbit!", "A solid trip through the stars. There’s always more to discover."]
            : ["🌙", "Keep looking up!", "Every great explorer starts somewhere. Ready for another mission?"];

      document.querySelector("#result-emoji").textContent = result[0];
      document.querySelector("#result-title").textContent = result[1];
      document.querySelector("#result-copy").textContent = result[2];
      document.querySelector("#final-score").textContent = `${score}/${questions.length}`;
      quizPanel.hidden = true;
      results.hidden = false;
      scorePill.hidden = true;
      results.querySelector("button").focus();
    }

    document.querySelector("#start-button").addEventListener("click", () => {
      intro.hidden = true;
      quizPanel.hidden = false;
      scorePill.hidden = false;
      renderQuestion();
      answersElement.querySelector("button").focus();
    });

    updateIntroBestScore();

    nextButton.addEventListener("click", () => {
      current += 1;
      if (current === questions.length) {
        showResults();
        return;
      }
      renderQuestion();
      answersElement.querySelector("button").focus();
    });

    document.querySelector("#restart-button").addEventListener("click", () => {
      current = 0;
      score = 0;
      scoreDisplay.textContent = "0";
      results.hidden = true;
      intro.hidden = false;
      updateIntroBestScore();
      document.querySelector("#start-button").focus();
    });
  </script>
</body>
</html>
